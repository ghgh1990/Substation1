<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Tinos:wght@400;700&family=Arimo:wght@400;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E74B5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-logo-192.png">
<link rel="apple-touch-icon" href="icon-logo-192.png">
<title>مولّد الكتب الرسمية</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#1a1d21;--mut:#5b6573;--bd:#cfd6df;--ac:#2E74B5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#21262c;--tx:#eceff3;--mut:#9aa5b1;--bd:#38404a}}
:root[data-theme="dark"]{--bg:#15181c;--card:#21262c;--tx:#eceff3;--mut:#9aa5b1;--bd:#38404a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:96px;margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Tahoma,sans-serif}
.form{background:var(--card);border-bottom:1px solid var(--bd);padding:12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:140px;resize:vertical;line-height:1.7}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;font:inherit;font-size:16px;font-weight:700;padding:11px;border-radius:8px;border:0;background:var(--ac);color:#fff;min-width:130px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#stage{overflow:hidden;padding:12px 0}
#holder{margin:0 auto;transform-origin:top center}
.page{width:210mm;height:297mm;background:#fff;color:#000;position:relative;font-family:Arial,Tahoma,sans-serif;direction:rtl;margin:0 auto;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.frame{position:absolute;inset:8.5mm;border:4px double #2E74B5}
.in{position:absolute;inset:8.5mm;padding:7mm 8mm 8mm;display:flex;flex-direction:column}
.hd{display:grid;grid-template-columns:1fr 38mm 1fr;align-items:center;padding-bottom:3mm;border-bottom:1.5px solid #000;min-height:34mm}
.hd .r{font-weight:700;font-size:18pt;line-height:1.5;text-align:right}
.hd .m{text-align:center}.hd img{width:36mm;height:auto;display:block;margin:0 auto}
.hd .l{font-weight:700;font-size:16pt;line-height:1.7;text-align:right;padding-right:4mm}
.to{font-weight:700;font-size:18pt;margin-top:6mm}
.subj{font-weight:700;font-size:16pt;text-align:center;margin-top:3mm}
.to .who{text-align:right}
.main{flex:1;margin-top:5mm;overflow:hidden}
.body{font-size:16pt;line-height:1.5;word-wrap:break-word}
.body div{text-align:justify;min-height:1.5em}
#pTbl table{border-collapse:collapse;margin:0 0 0 auto;max-width:100%;line-height:1.5}
#pTbl td{border:1px solid #000;padding:1.2mm 3mm;text-align:center}
#pTbl td.h{font-weight:700;background:#eee}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx);margin:0}
.chk input{width:auto}
#cellGrid{overflow-x:auto;max-width:100%}
#cellGrid table{border-collapse:collapse}
#cellGrid input{min-width:90px;padding:6px;font-size:15px;text-align:center}
#cellGrid td{padding:2px}
.sig{font-size:18pt;line-height:1.5;text-align:center;align-self:flex-end}
@page{size:A4;margin:0}
@media print{
 html,body{background:#fff}:root{padding:0}
 .form,.hint{display:none!important}
 #stage{padding:0;overflow:visible}
 #holder{transform:none!important;height:auto!important;width:auto!important}
 .page{box-shadow:none;margin:0;page-break-after:avoid}
}
.hint{font-size:13px;color:var(--mut);text-align:center;padding:0 12px 14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;align-items:center}
.bar button{width:100%;max-width:760px}
#st{font-size:13px;color:var(--mut);min-height:16px;text-align:center}
button:disabled{opacity:.45}
</style>
</head>
<body>
<div class="form">
 <div class="row"><button id="bUndo" class="sec" disabled>↶ تراجع</button><button id="bRedo" class="sec" disabled>↷ إعادة</button></div>
 <div class="row">
  <div><label for="fNo">العدد</label><input id="fNo" inputmode="numeric"></div>
  <div><label for="fDate">التاريخ</label><input id="fDate" type="date"></div>
 </div>
 <div><label for="fSubj">الموضوع (م/)</label><input id="fSubj"></div>
 <div><label for="fBody">متن الكتاب</label><textarea id="fBody"></textarea></div>
 <div class="row">
  <div><label for="fSize">حجم خط المتن</label>
   <select id="fSize"><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16" selected>16</option><option value="18">18</option></select></div>
  <div><label for="fFont">نوع الخط</label>
   <select id="fFont"><option value="tnr">Times New Roman</option><option value="arial" selected>Arial</option><option value="amiri">Amiri (أميري)</option><option value="cairo">Cairo (القاهرة)</option><option value="naskh">Noto Naskh (نسخ)</option></select></div>
 </div>
 <label class="chk"><input type="checkbox" id="fTblOn"> إضافة جدول</label>
 <div id="tblBox" style="display:none;gap:10px;grid-template-columns:1fr">
  <div class="row">
   <div><label for="fRows">عدد الصفوف</label><input id="fRows" type="number" min="1" max="20" value="3" inputmode="numeric"></div>
   <div><label for="fCols">عدد الأعمدة</label><input id="fCols" type="number" min="1" max="8" value="3" inputmode="numeric"></div>
  </div>
  <label class="chk"><input type="checkbox" id="fHdr" checked> الصف الأول عنوان (غامق)</label>
  <div id="cellGrid"></div>
 </div>
</div>
<div id="stage"><div id="holder">
<div class="page" id="page">
 <div class="frame"></div>

<script>
(function(){
 var $=function(i){return document.getElementById(i)};
 var FONTS={tnr:"'Times New Roman',Tinos,'Noto Naskh Arabic',serif",arial:"Arial,Arimo,'Noto Sans Arabic',sans-serif",amiri:"Amiri,serif",cairo:"Cairo,sans-serif",naskh:"'Noto Naskh Arabic',serif"};
 var KEY='letterGen2', ids=['fNo','fDate','fSubj','fBody','fSize','fFont'];
 function pad(n){return n<10?'0'+n:''+n}
 function fmt(v){if(!v)return'';var p=v.split('-');return p[0]+'/'+pad(+p[1])+'/'+pad(+p[2])}
 function save(){try{var o={};ids.forEach(function(i){o[i]=$(i).value});localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
 function load(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(o)ids.forEach(function(i){if(o[i]!=null)$(i).value=o[i]});
  if(!$('fDate').value){var d=new Date();$('fDate').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}}
 var tb={on:false,rows:3,cols:3,hdr:true,data:[]};
 var TKEY='letterGenTbl1';
 function saveT(){try{localStorage.setItem(TKEY,JSON.stringify(tb))}catch(e){}}
 function loadT(){try{var o=JSON.parse(localStorage.getItem(TKEY)||'null');if(o&&o.data)tb=o}catch(e){}
  $('fTblOn').checked=tb.on;$('fRows').value=tb.rows;$('fCols').value=tb.cols;$('fHdr').checked=tb.hdr;}
 function cell(r,c){return (tb.data[r]&&tb.data[r][c])||''}
 function resize(){
  var d=[];for(var r=0;r<tb.rows;r++){d[r]=[];for(var c=0;c<tb.cols;c++)d[r][c]=cell(r,c)}
  tb.data=d;
 }
 function buildGrid(){
  $('tblBox').style.display=tb.on?'grid':'none';
  var g=$('cellGrid');g.textContent='';
  if(!tb.on)return;
  var t=document.createElement('table');
  for(var r=0;r<tb.rows;r++){
   var tr=document.createElement('tr');
   for(var c=0;c<tb.cols;c++){
    var td=document.createElement('td'),i=document.createElement('input');
    i.value=cell(r,c);i.setAttribute('aria-label','صف '+(r+1)+' عمود '+(c+1));
    (function(r,c,i){i.addEventListener('input',function(){tb.data[r][c]=i.value;renderTbl();saveT();pushSoon()})})(r,c,i);
    td.appendChild(i);tr.appendChild(td);
   }
   t.appendChild(tr);
  }
  g.appendChild(t);
 }
 function renderTbl(){
  var w=$('pTbl');w.textContent='';
  w.style.fontSize=$('fSize').value+'pt';w.style.marginTop=$('fBody').value.trim()?'1.5em':'0';w.style.fontFamily=FONTS[$('fFont').value]||FONTS.arial;
  if(!tb.on)return;
  var t=document.createElement('table');
  for(var r=0;r<tb.rows;r++){
   var tr=document.createElement('tr');
   for(var c=0;c<tb.cols;c++){
    var td=document.createElement('td');td.textContent=cell(r,c);
    if(r===0&&tb.hdr)td.className='h';
    tr.appendChild(td);
   }
   t.appendChild(tr);
  }
  w.appendChild(t);
 }
 function tblChange(){
  tb.on=$('fTblOn').checked;
  tb.rows=Math.max(1,Math.min(20,parseInt($('fRows').value)||1));
  tb.cols=Math.max(1,Math.min(8,parseInt($('fCols').value)||1));
  tb.hdr=$('fHdr').checked;
  resize();buildGrid();renderTbl();saveT();pushNow();
 }
 function render(){
  $('pNo').textContent=$('fNo').value;
  $('pDate').textContent=fmt($('fDate').value);
  $('pSubj').textContent=$('fSubj').value;
  var b=$('pBody'),ff=FONTS[$('fFont').value]||FONTS.arial;
  b.textContent='';
  $('fBody').value.split('\n').forEach(function(s){var d=document.createElement('div');d.textContent=s;b.appendChild(d)});
  b.style.fontSize=$('fSize').value+'pt';b.style.fontFamily=ff;$('pSubj').style.fontFamily=ff;
  renderTbl();save();
 }
 function fit(){
  var h=$('holder'),w=document.documentElement.clientWidth-16,pw=$('page').offsetWidth,ph=$('page').offsetHeight;
  var s=Math.min(1,w/pw);
  h.style.width=pw+'px';h.style.transform='scale('+s+')';h.style.height=(ph*s)+'px';
  h.style.marginRight=h.style.marginLeft='auto';
  h.style.transformOrigin='top center';
 }
 ids.forEach(function(i){$(i).addEventListener('input',render);$(i).addEventListener('change',render)});
 var H=[],hi=-1,hT=null,restoring=false;
 function snap(){var o={};ids.forEach(function(i){o[i]=$(i).value});return JSON.stringify({f:o,t:tb})}
 function updBtns(){$('bUndo').disabled=hi<=0;$('bRedo').disabled=hi>=H.length-1}
 function pushNow(){
  clearTimeout(hT);if(restoring)return;
  var s=snap();if(H[hi]===s)return;
  H=H.slice(0,hi+1);H.push(s);if(H.length>200)H.shift();hi=H.length-1;updBtns();
 }
 function pushSoon(){clearTimeout(hT);hT=setTimeout(pushNow,500)}
 function restore(s){
  var o=JSON.parse(s);restoring=true;
  ids.forEach(function(i){if(o.f[i]!=null)$(i).value=o.f[i]});
  tb=o.t;
  $('fTblOn').checked=tb.on;$('fRows').value=tb.rows;$('fCols').value=tb.cols;$('fHdr').checked=tb.hdr;
  buildGrid();render();saveT();restoring=false;updBtns();
 }
 function undo(){pushNow();if(hi>0){hi--;restore(H[hi])}}
 function redo(){pushNow();if(hi<H.length-1){hi++;restore(H[hi])}}
 ids.forEach(function(i){$(i).addEventListener('input',pushSoon);$(i).addEventListener('change',pushNow)});
 $('bUndo').onclick=undo;$('bRedo').onclick=redo;
 document.addEventListener('keydown',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  var k=(e.key||'').toLowerCase();
  if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(k==='y'){e.preventDefault();redo()}
 });
 function wrapText(x,k,text,maxMm){
  var out=[];
  String(text).split('\n').forEach(function(par){
   if(!par.trim()){out.push({t:'',last:true});return}
   var words=par.split(/\s+/).filter(Boolean),line='';
   words.forEach(function(w){
    var c=line?line+' '+w:w;
    if(line&&x.measureText(c).width/k>maxMm){out.push({t:line,last:false});line=w}else line=c;
   });
   out.push({t:line,last:true});
  });
  return out;
 }
 function drawPage(){
  var W=1654,H=2339,k=W/210,PT=25.4/72,FF='Arial, Tahoma, sans-serif';
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.direction='rtl';x.textBaseline='middle';
  var BF=FONTS[$('fFont').value]||FONTS.arial;
  function font(pt,b,f){x.font=(b?'bold ':'')+(pt*PT*k)+'px '+(f||FF)}
  function T(s,mm,y,al){x.textAlign=al;x.fillText(s,mm*k,y*k)}
  var L=17.5,R=192.5;
  x.strokeStyle='#2E74B5';
  x.lineWidth=0.5*k;x.strokeRect(8.5*k,8.5*k,193*k,280*k);
  x.lineWidth=0.3*k;x.strokeRect(9.6*k,9.6*k,190.8*k,277.8*k);
  x.fillStyle='#000';
  font(18,1);
  T('قــسـم صيانة المحطات',R,28.4,'right');
  T('مـذكـرة داخـلـيـة',R,37.9,'right');
  var img=document.querySelector('#page img');
  if(img&&img.naturalWidth){var lw=36,lh=lw*img.naturalHeight/img.naturalWidth;x.drawImage(img,87*k,16.5*k,lw*k,lh*k)}
  font(16,1);
  T('العدد: '+$('fNo').value,82,28.3,'right');
  T('التاريخ: '+fmt($('fDate').value),82,37.9,'right');
  x.fillRect(L*k,52.4*k,(R-L)*k,0.4*k);
  font(18,1);
  T('السيد المدير المحترم',R,62.3,'right');
  font(16,1,BF);
  var y=68.95,sl=wrapText(x,k,'م/ '+$('fSubj').value,150);
  sl.forEach(function(l){T(l.t,105,y+3.65,'center');y+=7.3});
  y+=5;
  var pt=parseFloat($('fSize').value),lh2=pt*PT*1.5,al='justify',limit=251;
  font(pt,0,BF);
  var bl=wrapText(x,k,$('fBody').value,R-L);
  for(var i=0;i<bl.length;i++){
   if(y+lh2>limit+0.5)break;
   var l=bl[i],cy=y+lh2/2,words=l.t.split(' ');
   if(al==='justify'&&!l.last&&words.length>1){
    var sum=0;words.forEach(function(w){sum+=x.measureText(w).width/k});
    var gap=((R-L)-sum)/(words.length-1),pos=R;
    words.forEach(function(w){T(w,pos,cy,'right');pos-=x.measureText(w).width/k+gap});
   }else if(al==='center')T(l.t,105,cy,'center');
   else T(l.t,R,cy,'right');
   y+=lh2;
  }
  if(tb.on){
   if($('fBody').value.trim())y+=lh2;
   var th=1.2,px=3,tlh=pt*PT*1.5,cw=[],tot=0,r,c;
   for(c=0;c<tb.cols;c++){
    var mw=0;
    for(r=0;r<tb.rows;r++){font(pt,r===0&&tb.hdr,BF);mw=Math.max(mw,x.measureText(cell(r,c)).width/k)}
    cw[c]=mw+2*px;tot+=cw[c];
   }
   if(tot>R-L){var sc=(R-L)/tot;for(c=0;c<tb.cols;c++)cw[c]*=sc;tot=R-L}
   x.strokeStyle='#000';x.lineWidth=0.26*k;
   for(r=0;r<tb.rows;r++){
    var hb=(r===0&&tb.hdr),cl=[],mx=1;
    font(pt,hb,BF);
    for(c=0;c<tb.cols;c++){var wl=wrapText(x,k,cell(r,c),cw[c]-2*px);cl[c]=wl;mx=Math.max(mx,wl.length)}
    var rh=mx*tlh+2*th;
    if(y+rh>limit+0.5)break;
    var cx=R;
    for(c=0;c<tb.cols;c++){
     var left=cx-cw[c];
     if(hb){x.fillStyle='#eee';x.fillRect(left*k,y*k,cw[c]*k,rh*k)}
     x.strokeRect(left*k,y*k,cw[c]*k,rh*k);
     x.fillStyle='#000';font(pt,hb,BF);
     var st=y+(rh-cl[c].length*tlh)/2;
     cl[c].forEach(function(l,j){T(l.t,left+cw[c]/2,st+tlh*(j+0.5),'center')});
     cx=left;
    }
    y+=rh;
   }
  }

 function buildPdf(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=0,offs=[];
  function add(b){if(typeof b==='string')b=enc.encode(b);parts.push(b);off+=b.length}
  function obj(n,body){offs[n]=off;add(n+' 0 obj\n'+body+'\nendobj\n')}
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  var cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  offs[5]=off;
  add('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
  add(jpg);add('\nendstream\nendobj\n');
  var xr=off;
  add('xref\n0 6\n0000000000 65535 f \n');
  for(var i=1;i<=5;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
 }
